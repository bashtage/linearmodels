name: Type checking

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mypy:
    name: mypy (informational)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install mypy pandas-stubs scipy-stubs xarray
        python -m pip list
    # mypy is informational. New releases of mypy and of the stubs of NumPy, pandas
    # and SciPy often add errors, so a failure does not fail the check. The step
    # records the failure instead of failing, so that the only annotation is a
    # warning with the number of errors. The log of this step lists them.
    - name: Run mypy
      id: mypy
      run: python -m mypy linearmodels | tee mypy.txt || echo "failed=true" >> "$GITHUB_OUTPUT"
    - name: Report the result of mypy
      if: steps.mypy.outputs.failed == 'true'
      run: echo "::warning title=mypy::$(tail -n 1 mypy.txt). This check is informational."
