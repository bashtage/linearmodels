# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

parameters:
  # defaults for any parameters that are not specified
  name: ''
  vmImage: ''
  BUILD_FLAGS: ''


jobs:

- job: ${{ parameters.name }}_Test
  pool:
    vmImage: ${{ parameters.vmImage }}
  strategy:
    # Variables of an entry
    #   python.version   Version of Python. 3.15-dev is the newest 3.15, including
    #                    release candidates.
    #   PACKAGES         Installed in a single pip command with requirements.txt and
    #                    requirements-test.txt, so that pip also picks versions of
    #                    matplotlib, xarray, ... that work with the pins.
    #   PYTEST_PATTERN   (slow or not slow) also runs the slow tests
    #   test.sdist, test.wheel
    #                    Build and install the package in site-packages and test it
    #   BUILD_FLAGS      Options for building the Cython extension
    #   cython.coverage  Create the C file that coverage uses to report on the Cython
    #                    code. This only works up to Python 3.12 and with
    #                    COVERAGE_CORE=ctrace.
    #   style            Run the style checks
    #   nightly          Install nightly builds of numpy, scipy, pandas, ...
    #   experimental     Do not fail when the tests fail and do not collect coverage
    matrix:
      python314_latest:
        python.version: '3.14'
        PACKAGES: 'xxhash'
        PYTEST_PATTERN: "(slow or not slow)"
        style: true
      python314_no_binary:
        python.version: '3.14'
        PACKAGES: 'xxhash'
        BUILD_FLAGS: '-Csetup-args=-Dno-binary=true'
      # pandas 2.3, the last 2.x, with copy-on-write, which pandas 3 always uses
      python313_recent_wheel:
        python.version: '3.13'
        PACKAGES: 'xxhash numpy==2.2.6 scipy==1.15.3 pandas==2.3.3 statsmodels==0.14.5'
        LM_TEST_COPY_ON_WRITE: 1
        test.wheel: true
      # numpy 2.0, the first 2.x, and pandas 2.2, which renamed annual dates to YE-DEC
      python312_cython_coverage:
        python.version: '3.12'
        PACKAGES: 'xxhash numpy==2.0.2 scipy==1.13.1 pandas==2.2.3 statsmodels==0.14.4'
        BUILD_FLAGS: '-Csetup-args=-Dcython-coverage=true'
        cython.coverage: true
        COVERAGE_CORE: ctrace
      # pandas 2.0, the newest without DataFrame.stack(future_stack)
      python311_mid_sdist:
        python.version: '3.11'
        PACKAGES: 'xxhash numpy==1.24.4 scipy==1.10.1 pandas==2.0.3 statsmodels==0.14.0'
        test.sdist: true
      # The oldest versions that linearmodels supports. statsmodels 0.13.1 is the
      # oldest with a wheel for Python 3.10.
      python310_minimums:
        python.version: '3.10'
        PACKAGES: 'numpy==1.22.3 scipy==1.8.0 pandas==1.4.0 statsmodels==0.13.1 xarray==0.21.0 formulaic==1.2.1 pyhdfe==0.1.0'
        PYTEST_PATTERN: "(slow or not slow)"
        style: true
      python314_pre:
        python.version: '3.14'
        PACKAGES: 'xxhash'
        nightly: true
        experimental: true
      python315_latest:
        python.version: '3.15-dev'
        PACKAGES: 'xxhash'
        experimental: true
        style: true
    maxParallel: 10

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
      architecture: 'x64'
      # Needed to download a release candidate
      allowUnstable: true
    displayName: 'Use Python $(python.version)'

  - script: |
      set -e
      python -m pip install --upgrade pip wheel build
      python -m pip install -r requirements-dev.txt
      python -m pip install ${PACKAGES} -r requirements.txt -r requirements-test.txt
      jupyter kernelspec list
    displayName: 'Install dependencies'

  - script: |
      python -m pip install --pre --upgrade --no-deps --retries 10 --timeout 60 -i https://pypi.anaconda.org/scientific-python-nightly-wheels/simple --extra-index-url https://pypi.org/simple numpy pandas scipy matplotlib xarray statsmodels pyarrow
    displayName: 'Install nightly builds'
    condition: eq(variables['nightly'], 'true')
    continueOnError: true

  - script: |
     flake8 linearmodels
     black --check linearmodels
     isort --check linearmodels
     ruff check linearmodels
     flake8 linearmodels
    displayName: 'Check style and formatting'
    condition: eq(variables['style'], 'true')

  - script: |
      echo "Installing to site packages (sdist)"
      python -m build --sdist . -v  
      SDIST=$(ls -t ./dist/linearmodels-*.tar.gz | head -1)
      pip install ${SDIST} -v
    displayName: 'Install linearmodels (site-packages, sdist)'
    condition: eq(variables['test.sdist'], 'true')

  - script: |
      echo "Installing to site packages (wheel)"
      python -m pip wheel . --no-deps --wheel-dir ./dist/
      WHL=$(ls -t ./dist/linearmodels-*.whl | head -1)
      pip install ${WHL} -v
    displayName: 'Install linearmodels (site-packages, wheel)'
    condition: eq(variables['test.wheel'], 'true')

  - script: |
      echo python -m pip install --no-build-isolation -vv -e . ${BUILD_FLAGS}
      python -m pip install --no-build-isolation -vv -e . ${BUILD_FLAGS}
    displayName: 'Install linearmodels (editable)'
    condition: and(ne(variables['test.wheel'], 'true'), ne(variables['test.sdist'], 'true'))

  - script: |
      pushd linearmodels/panel
      cython --verbose -M --fast-fail -3  -X cpow=True -X boundscheck=False -X wraparound=False -X cdivision=True -X binding=True -X linetrace=True _utility.pyx
      popd
    displayName: 'Transpile Cython to C for coverage support'
    condition: eq(variables['cython.coverage'], 'true')

  # After linearmodels is installed so that this shows what is tested
  - script: python -m pip list
    displayName: 'List Configuration'

  - script: |
      echo "Testing site packages"
      mkdir test_run_dir
      pushd test_run_dir
      python -c "import linearmodels; linearmodels.test(['-n', 'auto', '--junitxml=../junit/test-results.xml'])"
      popd
    displayName: 'Run tests (site-packages)'
    condition: or(eq(variables['test.wheel'], 'true'), eq(variables['test.sdist'], 'true'))

  - script: |
      echo "Testing editable install"
      export COVERAGE_OPTS="--cov-config=.coveragerc --cov=linearmodels --cov-branch --cov-report xml:coverage.xml --cov-report term"
      echo pytest -m "${PYTEST_PATTERN}" --junitxml=junit/test-results.xml -n auto --durations=25 ${COVERAGE_OPTS} linearmodels/tests 
      pytest -m "${PYTEST_PATTERN}" --junitxml=junit/test-results.xml -n auto --durations=25 ${COVERAGE_OPTS} linearmodels/tests
    displayName: 'Run tests (editable)'
    condition: and(ne(variables['test.wheel'], 'true'), ne(variables['test.sdist'], 'true'), ne(variables['experimental'], 'true'))

  - script: |
      echo "Testing experimental configuration"
      echo pytest -m "${PYTEST_PATTERN}" --junitxml=junit/test-results.xml -n auto --durations=25 linearmodels/tests
      pytest -m "${PYTEST_PATTERN}" --junitxml=junit/test-results.xml -n auto --durations=25 linearmodels/tests
    displayName: 'Run tests (experimental)'
    condition: eq(variables['experimental'], 'true')
    continueOnError: true

  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/test-results.xml'
      testRunTitle: 'Python $(python.version)'
    condition: succeededOrFailed()

  - task: PublishCodeCoverageResults@2
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
    condition: and(ne(variables['test.sdist'], 'true'), ne(variables['test.wheel'], 'true'), ne(variables['experimental'], 'true'))

  - script: |
      curl -Os https://uploader.codecov.io/latest/linux/codecov
      chmod +x codecov
      ./codecov -f coverage.xml -F adder -F subtractor
    displayName: 'Codecov upload'
    condition: and(ne(variables['test.sdist'], 'true'), ne(variables['test.wheel'], 'true'), ne(variables['experimental'], 'true'))
