# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

parameters:
  # defaults for any parameters that are not specified
  name: ''
  vmImage: ''


jobs:

- job: ${{ parameters.name }}Test
  pool:
    vmImage: ${{ parameters.vmImage }}
  strategy:
    # The newest Python with the newest packages, and the oldest Python with numpy 1.x
    # (the default integer is 32 bits on Windows) and pandas 2.1, the first with
    # DataFrame.stack(future_stack). PACKAGES is installed in a single pip command
    # with requirements.txt and requirements-test.txt, so that pip also picks
    # versions of matplotlib, xarray, ... that work with the pins.
    matrix:
      python314_win_latest:
        python.version: '3.14'
      python310_win_numpy126:
        python.version: '3.10'
        PACKAGES: 'numpy==1.26.4 scipy==1.11.4 pandas==2.1.4 statsmodels==0.14.1'
    maxParallel: 10

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
      architecture: 'x64'
    displayName: 'Use Python $(python.version)'

  - script: |
      python -m pip install --upgrade pip "setuptools>=61" wheel
      python -m pip install -r requirements-dev.txt
      python -m pip install %PACKAGES% -r requirements.txt -r requirements-test.txt || exit /b 1
      jupyter kernelspec list
    displayName: 'Install dependencies'

  - script: |
      python -m pip install -e . -v --no-build-isolation
    displayName: 'Build Cython Extensions'

  # After linearmodels is installed so that this shows what is tested
  - script: |
      python -m pip list
    displayName: 'List Configuration'

  - script: |
      pytest linearmodels --junitxml=junit/test-results.xml -n 2 --durations=25
    displayName: 'pytest'

  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/test-results.xml'
      testRunTitle: 'Python $(python.version)'
    condition: succeededOrFailed()
